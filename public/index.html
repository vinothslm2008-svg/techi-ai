<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Techi Live Voice AI</title>
<style>
:root {
  --bg: #070a0f;
  --accent: #00e5a0;
  --accent-glow: rgba(0, 229, 160, 0.4);
  --magenta: #ff79c6;
  --magenta-glow: rgba(255, 121, 198, 0.5);
  --gold: #ffd166;
  --gold-glow: rgba(255, 209, 102, 0.6);
  --text: #eef3f7;
  --muted: #7a8b9e;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; user-select: none;
}

/* Background Ambient Glow */
.ambient-glow {
  position: absolute; width: 350px; height: 350px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 229, 160, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
  pointer-events: none; filter: blur(40px); animation: ambientPulse 6s ease-in-out infinite;
}
@keyframes ambientPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 0.8; } }

/* Title Header */
.top-title {
  position: absolute; top: 30px; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.top-title h1 {
  margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 1px; color: var(--text); opacity: 0.9;
}
.top-title span {
  font-size: 11px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase;
}

/* Center Interactive Orb */
.orb-container {
  position: relative; width: 220px; height: 220px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 10;
}

/* Outer Pulsing Rings */
.ring {
  position: absolute; border-radius: 50%; border: 1px solid rgba(0, 229, 160, 0.2);
  pointer-events: none; transition: all 0.5s ease;
}
.ring-1 { width: 220px; height: 220px; animation: rotateRing 15s linear infinite; border-dasharray: 8 6; }
.ring-2 { width: 180px; height: 180px; animation: rotateRingRev 10s linear infinite; border-color: rgba(0, 184, 255, 0.25); }

@keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes rotateRingRev { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

/* Core Glowing Orb */
.core-orb {
  width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #00e5a0, #0077ff);
  box-shadow: 0 0 50px var(--accent-glow), inset 0 0 20px rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center; font-size: 50px;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  animation: idleOrb 3s ease-in-out infinite;
}

@keyframes idleOrb {
  0%, 100% { transform: scale(1); box-shadow: 0 0 45px var(--accent-glow); }
  50% { transform: scale(1.06); box-shadow: 0 0 65px var(--accent-glow); }
}

/* State Animations */
.core-orb.listening {
  background: radial-gradient(circle at 35% 35%, #ff79c6, #b388ff);
  box-shadow: 0 0 70px var(--magenta-glow);
  animation: listeningOrb 0.7s ease-in-out infinite alternate;
}
@keyframes listeningOrb {
  from { transform: scale(0.96); filter: brightness(1); }
  to { transform: scale(1.14); filter: brightness(1.25); }
}

.core-orb.speaking {
  background: radial-gradient(circle at 35% 35%, #00e5a0, #ffd166);
  box-shadow: 0 0 85px var(--gold-glow);
  animation: speakingOrb 0.4s ease-in-out infinite alternate;
}
@keyframes speakingOrb {
  from { transform: scale(1.02); filter: brightness(1.1); }
  to { transform: scale(1.18); filter: brightness(1.35); }
}

/* Status Text below Orb */
.status-text {
  position: absolute; bottom: 80px; text-align: center;
  font-size: 14px; font-weight: 500; color: var(--muted);
  max-width: 80%; line-height: 1.4; transition: color 0.3s ease;
}
.status-text.active { color: var(--accent); }

/* Tap Instruction Hint */
.tap-hint {
  position: absolute; bottom: 40px; font-size: 11px; color: var(--muted);
  letter-spacing: 1px; text-transform: uppercase; opacity: 0.6;
}
</style>
</head>
<body>

<div class="ambient-glow"></div>

<div class="top-title">
  <h1>TECHIS AI</h1>
  <span>Live Voice Intelligence • Tamil • Tanglish • English</span>
</div>

<!-- Center Glowing Live Orb -->
<div class="orb-container" onclick="toggleVoiceSession()">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="core-orb" id="techiOrb">🎙️</div>
</div>

<div class="status-text" id="statusText">Tap Orb to Start Live Conversation</div>
<div class="tap-hint">Handsfree Continuous Voice Mode</div>

<script>
/* =========================================================================
   LIVE VOICE AI ENGINE (STANDALONE PURE ORB INTERACTION)
   ========================================================================= */

let isListening = false;
let isSpeaking = false;
let recognition = null;
let speechSynth = window.speechSynthesis;

// Web Speech API Initialization
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRec();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-IN'; // Works seamlessly for Tamil, Tanglish & English

  recognition.onstart = () => {
    isListening = true;
    setOrbState('listening', 'Listening...');
  };

  recognition.onresult = async (event) => {
    const transcript = event.results[0][0].transcript;
    console.log("User Spoke:", transcript);
    processLiveVoiceInput(transcript);
  };

  recognition.onerror = (e) => {
    console.warn("Speech Error:", e.error);
    isListening = false;
    if (!isSpeaking) setOrbState('idle', 'Tap Orb to talk');
  };

  recognition.onend = () => {
    isListening = false;
    if (!isSpeaking) setOrbState('idle', 'Tap Orb to talk');
  };
}

function toggleVoiceSession() {
  if (isSpeaking) {
    speechSynth.cancel();
    isSpeaking = false;
  }

  if (!recognition) {
    alert("Voice Speech Recognition not supported on this browser.");
    return;
  }

  if (isListening) {
    recognition.stop();
    isListening = false;
    setOrbState('idle', 'Tap Orb to talk');
  } else {
    startListening();
  }
}

function startListening() {
  if (isSpeaking) speechSynth.cancel();
  try {
    recognition.start();
  } catch(e) {
    recognition.stop();
    setTimeout(() => recognition.start(), 200);
  }
}

async function processLiveVoiceInput(text) {
  setOrbState('thinking', 'Thinking...');

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();
    const spokenReply = data.speech || "Super bro!";
    
    speakLiveTTS(spokenReply);
  } catch(err) {
    console.error("AI Error:", err);
    speakLiveTTS("Connection error bro. Try again!");
  }
}

function speakLiveTTS(text) {
  if (!speechSynth) return;

  if (recognition && isListening) {
    recognition.abort();
    isListening = false;
  }

  speechSynth.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  
  const voices = speechSynth.getVoices();
  const indianVoice = voices.find(v => v.lang.includes('en-IN') || v.lang.includes('ta-IN'));
  if (indianVoice) utterance.voice = indianVoice;
  
  utterance.rate = 1.0;
  utterance.pitch = 1.0;

  utterance.onstart = () => {
    isSpeaking = true;
    setOrbState('speaking', text);
  };

  utterance.onend = utterance.onerror = () => {
    isSpeaking = false;
    setOrbState('idle', 'Tap Orb to talk');
    // Automatically resume handsfree listening loop
    setTimeout(() => startListening(), 800);
  };

  speechSynth.speak(utterance);
}

function setOrbState(state, textMsg) {
  const orb = document.getElementById('techiOrb');
  const label = document.getElementById('statusText');

  orb.className = 'core-orb';
  label.textContent = textMsg || '';
  label.className = 'status-text';

  if (state === 'listening') {
    orb.classList.add('listening');
    orb.textContent = '👂';
    label.classList.add('active');
  } else if (state === 'speaking') {
    orb.classList.add('speaking');
    orb.textContent = '🗣️';
    label.classList.add('active');
  } else if (state === 'thinking') {
    orb.textContent = '🧠';
  } else {
    orb.textContent = '🎙️';
  }
}
</script>

</body>
</html>
